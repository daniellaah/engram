[project]
name = "engram"
version = "0.1.0"
description = "A lightweight Python framework for building multi-provider AI agents"
readme = "README.md"
authors = [
    { name = "Gao Bo", email = "lilocryxuan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "structlog>=25,<26",
    "tenacity>=9,<10",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "respx>=0.22,<1",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
